<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>胸痛病历填写</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-light: #eff6ff;
    --bg: #f1f5f9;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-light: #64748b;
    --placeholder: #94a3b8;
    --radius: 8px;
    --radius-sm: 6px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html { height: 100%; }

  /* ===== 背景：方案 F ===== */
  body {
    margin: 0;
    padding: 0;
    font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    font-size: 15px;
    min-height: 100%;

    background:
      repeating-linear-gradient(
        180deg,
        transparent 0,
        transparent 39px,
        rgba(148,163,184,0.06) 39px,
        rgba(148,163,184,0.06) 40px
      ),
      linear-gradient(rgba(148,163,184,0.06) 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(90deg, rgba(148,163,184,0.06) 1px, transparent 1px) 0 0 / 24px 24px,
      radial-gradient(circle at 0% 0%, rgba(59,130,246,0.10) 0%, transparent 40%),
      radial-gradient(circle at 100% 100%, rgba(139,92,246,0.10) 0%, transparent 40%),
      linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
    background-attachment: fixed;
  }

  /* ===== 泡泡画布 ===== */
  #petalCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 9999;
    opacity: 1;
  }

  .toolbar, .main {
    position: relative;
  }

  /* ===== 顶部工具栏 ===== */
  .toolbar {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .toolbar .title {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    margin-right: auto;
    letter-spacing: 0.5px;
  }
  .toolbar .title::before {
    content: "";
    display: inline-block;
    width: 4px;
    height: 18px;
    background: var(--primary);
    border-radius: 2px;
    margin-right: 8px;
    vertical-align: -2px;
  }

  .btn {
    height: 38px;
    padding: 0 20px;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s ease;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    color: #fff;
    box-shadow: 0 1px 2px rgba(37,99,235,0.3);
  }
  .btn-primary:hover {
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    box-shadow: 0 4px 10px rgba(37,99,235,0.35);
    transform: translateY(-1px);
  }
  .btn-primary:active {
    transform: translateY(0);
    box-shadow: 0 1px 2px rgba(37,99,235,0.3);
  }

  /* ===== 主体 ===== */
  .main {
    padding: 24px 20px;
    min-height: calc(100vh - 63px);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 36px;
    box-shadow: var(--shadow);
    max-width: 1400px;
    margin: 0 auto;
  }

  /* ===== 表单 ===== */
  .form-area {
    line-height: 2.6;
    font-size: 15px;
    color: var(--text);
  }

  /* ===== 内嵌控件 ===== */
  .inline-input,
  .inline-date,
  .inline-time,
  .inline-select {
    height: 34px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0 10px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: #fff;
    outline: none;
    margin: 0 4px;
    vertical-align: middle;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .inline-input:hover,
  .inline-date:hover,
  .inline-time:hover,
  .inline-select:hover {
    border-color: #cbd5e1;
  }
  .inline-input:focus,
  .inline-date:focus,
  .inline-time:focus,
  .inline-select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
  }
  .inline-input::placeholder { color: var(--placeholder); font-style: italic; }
  .inline-input.small { width: 80px; }
  .inline-input.medium { width: 120px; }
  .inline-input.large { width: 200px; }
  .inline-date { width: 140px; }
  .inline-time { width: 70px; }
  .inline-select {
    width: 76px;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 8px center;
    background-size: 14px;
    padding-right: 26px;
    cursor: pointer;
  }

  .auto-input {
    min-width: 80px;
    max-width: 100%;
    transition: width 0.1s, border-color 0.15s, box-shadow 0.15s;
  }

  /* 时间组合 */
  .time-group {
    display: inline-flex;
    align-items: center;
    gap: 0;
    margin: 0 6px;
    vertical-align: middle;
    flex-wrap: nowrap;
    background: #f8fafc;
    border-radius: var(--radius-sm);
    padding: 2px;
  }
  .time-group .inline-date,
  .time-group .inline-time {
    margin: 0;
    border-color: transparent;
    background: transparent;
  }
  .time-group .inline-date:focus,
  .time-group .inline-time:focus {
    background: #fff;
    border-color: var(--primary);
  }
  .time-group:hover {
    background: #f1f5f9;
  }

  /* ===== 预览区 ===== */
  .preview-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-light);
    margin: 32px 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .preview-title::before {
    content: "";
    width: 3px;
    height: 14px;
    background: var(--primary);
    border-radius: 2px;
  }
  .preview-text {
    width: 100%;
    min-height: 240px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 18px 20px;
    font-family: "SimHei", "Heiti SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.9;
    color: #334155;
    background: #f8fafc;
    outline: none;
    resize: vertical;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .preview-text:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
    background: #fff;
  }

  /* ===== 平板 ===== */
  @media (max-width: 1024px) {
    .card { padding: 24px 20px; }
    .form-area { font-size: 14.5px; }
  }

  /* ===== 手机 ===== */
  @media (max-width: 768px) {
    body { background-attachment: scroll; }

    .toolbar { padding: 10px 14px; gap: 8px; }
    .toolbar .title { width: 100%; margin-bottom: 8px; font-size: 15px; }
    .btn { height: 42px; padding: 0 18px; font-size: 14px; flex: 1; }

    .main { padding: 14px; }
    .card { padding: 18px 14px; border-radius: 6px; }

    .form-area { line-height: 3; font-size: 15px; }

    .inline-input,
    .inline-date,
    .inline-time,
    .inline-select {
      height: 38px;
      font-size: 15px;
      padding: 0 10px;
      margin: 3px 2px;
    }
    .inline-input.small { width: 90px; }
    .inline-input.medium { width: 130px; }
    .inline-input.large { width: 160px; }
    .inline-date { width: 145px; }
    .inline-time { width: 75px; }
    .inline-select { width: 82px; }

    .time-group { flex-wrap: wrap; margin: 3px 0; padding: 3px; }

    .preview-text { min-height: 220px; padding: 14px; }
  }

  /* ===== 小手机 ===== */
  @media (max-width: 480px) {
    .card { padding: 14px 10px; }
    .form-area { font-size: 14.5px; }
    .btn { font-size: 13px; padding: 0 14px; }
    .inline-input.large { width: 130px; }
  }
</style>
</head>
<body>

<!-- 泡泡画布 -->
<canvas id="petalCanvas"></canvas>

<div class="toolbar">
  <div class="title">胸痛病历填写</div>
  <button class="btn btn-primary" onclick="saveToFile()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
    保存到本地
  </button>
</div>

<div class="main">
  <div class="card">

    <!-- 表单 -->
    <div class="form-area">

      患者
      <input class="inline-input auto-input" id="patientName" placeholder="诱因" />
      ，
      <input class="inline-input small" id="hoursAgo" placeholder="如 2、3.5" />
      小时前，
      <span class="time-group">
        <input type="date" class="inline-date" id="onsetDate" />
        <input type="time" class="inline-time" id="onsetTime" />
      </span>
      在家中休息时突发胸痛不适，
      <input class="inline-input medium" id="chestLocation" placeholder="如 心前区、胸骨后" />
      <input class="inline-input medium" id="painType" placeholder="如 闷痛、压榨样" />
      较剧，伴大汗淋漓，持续不能缓解，

      <select class="inline-select" id="hasAmaurosis">
        <option value="无">无</option>
        <option value="有">有</option>
      </select>一过性黑朦，
      <select class="inline-select" id="hasDyspneaChest">
        <option value="无">无</option>
        <option value="有">有</option>
      </select>胸闷、气闭，
      <select class="inline-select" id="hasNausea">
        <option value="无">无</option>
        <option value="有">有</option>
      </select>恶心、呕吐，
      <select class="inline-select" id="hasCough">
        <option value="无">无</option>
        <option value="有">有</option>
      </select>咳嗽咳痰，
      <select class="inline-select" id="hasFever">
        <option value="无">无</option>
        <option value="有">有</option>
      </select>发热，
      <select class="inline-select" id="hasDyspnea">
        <option value="无">无</option>
        <option value="有">有</option>
      </select>呼吸困难，无咯血，无吞咽困难，休息后无缓解，

      <span class="time-group">
        <input type="date" class="inline-date" id="arriveDate" />
        <input type="time" class="inline-time" id="arriveTime" />
      </span>
      <input class="inline-input medium" id="arriveMethod" placeholder="来院方式" />
      我院急诊就诊。

      <span class="time-group">
        <input type="date" class="inline-date" id="doctorDate" />
        <input type="time" class="inline-time" id="doctorTime" />
      </span>
      急诊医师接诊，

      <span class="time-group">
        <input type="date" class="inline-date" id="ecgDate" />
        <input type="time" class="inline-time" id="ecgTime" />
      </span>
      查急诊心电图提示
      <input class="inline-input large" id="ecgReport" placeholder="如 V1-V4 ST段抬高" />
      ，

      <span class="time-group">
        <input type="date" class="inline-date" id="ecgDiagDate" />
        <input type="time" class="inline-time" id="ecgDiagTime" />
      </span>
      心电图诊断急性ST段抬高型心肌梗塞，

      <span class="time-group">
        <input type="date" class="inline-date" id="troponinSendDate" />
        <input type="time" class="inline-time" id="troponinSendTime" />
      </span>
      送检肌钙蛋白，

      <span class="time-group">
        <input type="date" class="inline-date" id="troponinResultDate" />
        <input type="time" class="inline-time" id="troponinResultTime" />
      </span>
      肌钙蛋白结果回报
      <input class="inline-input small" id="troponinValue" placeholder="如 0.5" />
      ng/ml，

      <span class="time-group">
        <input type="date" class="inline-date" id="consultDate" />
        <input type="time" class="inline-time" id="consultTime" />
      </span>
      心内科医师会诊，诊断急性ST段抬高型心肌梗塞。

      <span class="time-group">
        <input type="date" class="inline-date" id="medicineDate" />
        <input type="time" class="inline-time" id="medicineTime" />
      </span>
      予以
      <input class="inline-input auto-input" id="medicineText"
        value="阿司匹林300mg、氯吡格雷300mg/替格瑞洛180mg抗血小板聚集，阿托伐他汀 40mg降脂稳斑" />
      ，患者仍有胸痛不适，因在时间窗内，有急诊介入治疗指征，患者及家属商议后决定冠脉造影，

      <span class="time-group">
        <input type="date" class="inline-date" id="consentStartDate" />
        <input type="time" class="inline-time" id="consentStartTime" />
      </span>
      开始知情同意，

      <span class="time-group">
        <input type="date" class="inline-date" id="consentSignDate" />
        <input type="time" class="inline-time" id="consentSignTime" />
      </span>
      签署知情同意书，

      <span class="time-group">
        <input type="date" class="inline-date" id="labStartDate" />
        <input type="time" class="inline-time" id="labStartTime" />
      </span>
      启动导管室，

      <span class="time-group">
        <input type="date" class="inline-date" id="labActiveDate" />
        <input type="time" class="inline-time" id="labActiveTime" />
      </span>
      导管室激活。为进一步诊治收住入院。

    </div>

    <div class="preview-title">病历预览</div>
    <textarea class="preview-text" id="previewText" readonly></textarea>

  </div>
</div>

<script>
// ===== 所有字段 ID =====
const fields = [
  'patientName', 'hoursAgo',
  'onsetDate', 'onsetTime',
  'chestLocation', 'painType',
  'hasAmaurosis', 'hasDyspneaChest', 'hasNausea', 'hasCough', 'hasFever', 'hasDyspnea',
  'arriveDate', 'arriveTime', 'arriveMethod',
  'doctorDate', 'doctorTime',
  'ecgDate', 'ecgTime', 'ecgReport',
  'ecgDiagDate', 'ecgDiagTime',
  'troponinSendDate', 'troponinSendTime',
  'troponinResultDate', 'troponinResultTime', 'troponinValue',
  'consultDate', 'consultTime',
  'medicineDate', 'medicineTime', 'medicineText',
  'consentStartDate', 'consentStartTime',
  'consentSignDate', 'consentSignTime',
  'labStartDate', 'labStartTime',
  'labActiveDate', 'labActiveTime'
];

fields.forEach(id => {
  const el = document.getElementById(id);
  if (el) {
    el.addEventListener('input', updatePreview);
    el.addEventListener('change', updatePreview);
  }
});

function formatTime(dateStr, timeStr) {
  if (!dateStr) return '（时间）';
  return timeStr ? dateStr + ' ' + timeStr : dateStr;
}

function updatePreview() {
  const v = id => document.getElementById(id)?.value || '';

  const text =
    `患者（${v('patientName')}），（${v('hoursAgo')}）小时前，` +
    `${formatTime(v('onsetDate'), v('onsetTime'))}在家中休息时突发胸痛不适，` +
    `（${v('chestLocation')}）（${v('painType')}）较剧，伴大汗淋漓，持续不能缓解，` +
    `（${v('hasAmaurosis')}）一过性黑朦，（${v('hasDyspneaChest')}）胸闷、气闭，` +
    `（${v('hasNausea')}）恶心、呕吐，（${v('hasCough')}）咳嗽咳痰，（${v('hasFever')}）发热，` +
    `（${v('hasDyspnea')}）呼吸困难，无咯血，无吞咽困难，休息后无缓解，` +
    `${formatTime(v('arriveDate'), v('arriveTime'))}（${v('arriveMethod')}）我院急诊就诊。` +
    `${formatTime(v('doctorDate'), v('doctorTime'))}急诊医师接诊，` +
    `${formatTime(v('ecgDate'), v('ecgTime'))}查“急诊心电图提示（${v('ecgReport')}）”，` +
    `${formatTime(v('ecgDiagDate'), v('ecgDiagTime'))}心电图诊断急性ST段抬高型心肌梗塞，` +
    `${formatTime(v('troponinSendDate'), v('troponinSendTime'))}送检肌钙蛋白，` +
    `${formatTime(v('troponinResultDate'), v('troponinResultTime'))}肌钙蛋白结果回报（${v('troponinValue')}）ng/ml，` +
    `${formatTime(v('consultDate'), v('consultTime'))}心内科医师会诊，诊断“急性ST段抬高型心肌梗塞”。` +
    `${formatTime(v('medicineDate'), v('medicineTime'))}予以“${v('medicineText')}”，` +
    `患者仍有胸痛不适，因在时间窗内，有急诊介入治疗指征，患者及家属商议后决定冠脉造影，` +
    `${formatTime(v('consentStartDate'), v('consentStartTime'))}开始知情同意，` +
    `${formatTime(v('consentSignDate'), v('consentSignTime'))}签署知情同意书，` +
    `${formatTime(v('labStartDate'), v('labStartTime'))}启动导管室，` +
    `${formatTime(v('labActiveDate'), v('labActiveTime'))}导管室激活。为进一步诊治收住入院。`;

  document.getElementById('previewText').value = text;
}

function saveToFile() {
  const text = document.getElementById('previewText').value;
  const blob = new Blob(['\ufeff' + text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);

  const now = new Date();
  const stamp = now.getFullYear() +
    String(now.getMonth() + 1).padStart(2, '0') +
    String(now.getDate()).padStart(2, '0') + '_' +
    String(now.getHours()).padStart(2, '0') +
    String(now.getMinutes()).padStart(2, '0') +
    String(now.getSeconds()).padStart(2, '0');

  const a = document.createElement('a');
  a.href = url;
  a.download = `胸痛病历_${stamp}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

// ===== 自适应宽度输入框 =====
const autoInputIds = ['patientName', 'medicineText'];

function autoResizeInput(el) {
  if (!el) return;

  let measurer = document.getElementById('__auto_measure__');
  if (!measurer) {
    measurer = document.createElement('span');
    measurer.id = '__auto_measure__';
    measurer.style.position = 'absolute';
    measurer.style.visibility = 'hidden';
    measurer.style.whiteSpace = 'pre';
    document.body.appendChild(measurer);
  }

  const style = getComputedStyle(el);
  measurer.style.font = style.font;
  measurer.style.padding = style.padding;
  measurer.style.border = style.border;

  const text = el.value || el.placeholder || '';
  measurer.textContent = text;

  const borderW = parseFloat(style.borderLeftWidth) + parseFloat(style.borderRightWidth);
  const paddingW = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
  const extra = 10;

  const newWidth = measurer.offsetWidth + borderW + paddingW + extra;
  const min = 80;
  const max = el.parentElement ? el.parentElement.clientWidth - 20 : 600;

  el.style.width = Math.min(Math.max(newWidth, min), max) + 'px';
}

autoInputIds.forEach(id => {
  const el = document.getElementById(id);
  if (!el) return;

  autoResizeInput(el);
  el.addEventListener('input', () => {
    autoResizeInput(el);
    updatePreview();
  });
  window.addEventListener('resize', () => autoResizeInput(el));
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => autoResizeInput(el));
  }
});

// ===== 背景飘泡泡（粉色） =====
(function initPetals() {
  const canvas = document.getElementById('petalCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  let W, H, dpr;
  let petals = [];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function random(min, max) {
    return min + Math.random() * (max - min);
  }

  function createPetal(initial = false) {
    return {
      x: random(0, W),
      y: initial ? random(-H, H) : random(-80, -20),
      size: random(6, 16),
      speedY: random(0.2, 0.8),
      speedX: random(-0.3, 0.5),
      sway: random(0.3, 1.0),
      swayPhase: random(0, Math.PI * 2),
      opacity: random(0.4, 0.8),
      color: 'rgba(255, 200, 220, '
    };
  }

  function init() {
    resize();
    petals = [];
    const count = W < 768 ? 22 : 38;
    for (let i = 0; i < count; i++) {
      petals.push(createPetal(true));
    }
    window.addEventListener('resize', resize);
  }

  // 画泡泡
  function drawPetal(p) {
    ctx.save();
    ctx.translate(p.x, p.y);

    const r = p.size;

    // 泡泡主体
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.closePath();

    // 径向渐变，模拟泡泡质感
    const grad = ctx.createRadialGradient(
      -r * 0.3, -r * 0.3, r * 0.1,
      0, 0, r
    );
    grad.addColorStop(0, p.color + (p.opacity * 0.5) + ')');
    grad.addColorStop(0.7, p.color + (p.opacity * 0.2) + ')');
    grad.addColorStop(1, p.color + (p.opacity * 0.6) + ')');
    ctx.fillStyle = grad;
    ctx.fill();

    // 边缘描边
    ctx.strokeStyle = p.color + (p.opacity * 0.8) + ')';
    ctx.lineWidth = 1;
    ctx.stroke();

    // 左上高光
    ctx.beginPath();
    ctx.arc(-r * 0.35, -r * 0.35, r * 0.25, 0, Math.PI * 2);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fill();

    // 右下次高光
    ctx.beginPath();
    ctx.arc(r * 0.4, r * 0.4, r * 0.12, 0, Math.PI * 2);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fill();

    ctx.restore();
  }

  let lastTime = 0;
  function animate(time) {
    const dt = Math.min(time - lastTime, 50);
    lastTime = time;

    ctx.clearRect(0, 0, W, H);

    for (let i = 0; i < petals.length; i++) {
      const p = petals[i];

      p.y += p.speedY * (dt / 16);
      p.swayPhase += 0.02;
      p.x += p.speedX * (dt / 16) + Math.sin(p.swayPhase) * p.sway * 0.3;

      if (p.y > H + 40) {
        petals[i] = createPetal(false);
        continue;
      }
      if (p.x < -40) p.x = W + 20;
      if (p.x > W + 40) p.x = -20;

      drawPetal(p);
    }

    requestAnimationFrame(animate);
  }

  init();
  requestAnimationFrame(animate);
})();

// ===== 初始化预览 =====
updatePreview();
</script>
